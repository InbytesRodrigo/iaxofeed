<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0C0C0C">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <title>Login - IAXO Ads</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { --primary: #FF6B2C; --primary-light: #FF8F5E; --secondary: #FFB347; --accent: #FF6B6B; --bg: #0C0C0C; --bg-card: #1C1C1C; --bg-card-2: #222222; --text: #FFFFFF; --text-2: #A0A0A0; --text-3: #6B6B6B; --border: #2A2A2A; --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        body::before { content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at 30% 40%, rgba(255,107,44,0.12) 0%, transparent 50%); pointer-events: none; }

        /* ===== APP TOP BAR ===== */
        .app-topbar { display: flex; align-items: center; justify-content: center; padding: calc(var(--safe-top) + 10px) 16px 10px; position: relative; z-index: 10; }
        .app-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .app-logo-icon { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; font-size: 14px; color: white; }
        .app-logo-text { font-size: 20px; font-weight: 800; color: var(--text); }
        .app-logo-text span { color: var(--secondary); font-weight: 500; }

        /* ===== MAIN SCROLL AREA ===== */
        .app-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; align-items: center; padding: 20px 20px calc(var(--safe-bottom) + 70px); }

        /* ===== LOGIN CARD ===== */
        .login-card { width: 100%; max-width: 400px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 24px; padding: 32px 24px 28px; margin-bottom: 16px; }
        .login-card h2 { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .login-card .sub { text-align: center; color: var(--text-3); font-size: 13px; margin-bottom: 24px; }

        .field { margin-bottom: 14px; }
        .field-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 5px; padding-left: 2px; }
        .field-wrap { position: relative; }
        .field-wrap i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 14px; pointer-events: none; }
        .field-input { width: 100%; padding: 13px 14px 13px 40px; background: rgba(30,30,66,0.6); border: 1px solid var(--border); border-radius: 14px; color: var(--text); font-size: 15px; font-family: 'Inter', sans-serif; outline: none; transition: 0.25s; -webkit-appearance: none; }
        .field-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,44,0.15); }
        .field-input::placeholder { color: var(--text-3); }

        .opts { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px; }
        .opts label { display: flex; align-items: center; gap: 6px; color: var(--text-2); cursor: pointer; }
        .opts a { color: var(--primary-light); text-decoration: none; font-weight: 500; }

        .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.25s; font-family: 'Inter', sans-serif; letter-spacing: 0.3px; }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 0 30px rgba(255,107,44,0.4); }
        .btn-login:active { transform: scale(0.98); }
        .btn-login:disabled { opacity: 0.6; cursor: wait; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .divider { text-align: center; margin: 20px 0; position: relative; color: var(--text-3); font-size: 12px; }
        .divider::before { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: var(--border); }
        .divider span { background: var(--bg-card); padding: 0 14px; position: relative; z-index: 1; }

        .demo-card { padding: 16px; background: rgba(255,107,44,0.06); border: 1px solid rgba(255,107,44,0.15); border-radius: 16px; }
        .demo-card h4 { font-size: 10px; color: var(--primary-light); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
        .demo-btn { width: 100%; padding: 12px; margin-bottom: 8px; background: rgba(30,30,66,0.5); border: 1px solid var(--border); border-radius: 12px; color: var(--text-2); font-size: 13px; cursor: pointer; transition: 0.25s; font-family: 'Inter', sans-serif; display: flex; align-items: center; gap: 10px; }
        .demo-btn:last-child { margin-bottom: 0; }
        .demo-btn:active { transform: scale(0.97); background: rgba(255,107,44,0.12); }
        .demo-btn i { color: var(--primary-light); width: 18px; text-align: center; font-size: 13px; }

        .error-msg { color: var(--accent); font-size: 13px; text-align: center; margin-bottom: 12px; display: none; background: rgba(255,107,107,0.08); border: 1px solid rgba(255,107,107,0.2); border-radius: 10px; padding: 10px; }

        .goto-cadastro { text-align: center; margin-top: 16px; font-size: 13px; color: var(--text-3); }
        .goto-cadastro a { color: var(--primary-light); text-decoration: none; font-weight: 600; }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,30,0.95); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0 calc(var(--safe-bottom) + 6px); z-index: 100; }
        .bn-item { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: var(--text-3); font-size: 10px; font-weight: 500; padding: 4px 16px; border-radius: 12px; transition: 0.2s; -webkit-tap-highlight-color: transparent; }
        .bn-item i { font-size: 20px; transition: 0.2s; }
        .bn-item.active { color: var(--primary-light); }
        .bn-item.active i { color: var(--primary-light); transform: scale(1.1); }
        .bn-item:active { transform: scale(0.9); }

        /* ===== DESKTOP ===== */
        @media (min-width: 769px) {
            body { justify-content: center; align-items: center; overflow: auto; }
            .app-topbar { display: none; }
            .bottom-nav { display: none; }
            .app-body { padding: 40px 20px; overflow: visible; }
            .login-card { padding: 44px 36px; }
        }

        /* ===== MOBILE ===== */
        @media (max-width: 768px) {
            .login-card { border-radius: 20px; }
            .login-card h2 { font-size: 20px; }
            .field-input { font-size: 16px; /* prevent zoom on iOS */ }
        }
        @media (max-width: 400px) {
            .login-card { padding: 28px 18px 24px; }
        }
    </style>
</head>
<body>
    <!-- App Top Bar -->
    <div class="app-topbar">
        <a href="../index.html" class="app-logo">
            <div class="app-logo-icon"><i class="fas fa-bolt"></i></div>
            <div class="app-logo-text">IAXO<span>Feed</span></div>
        </a>
    </div>

    <!-- Main Content -->
    <div class="app-body">
        <div class="login-card">
            <h2>Bem-vindo de volta</h2>
            <p class="sub">Entre na sua conta para gerenciar suas campanhas</p>
            
            <div class="error-msg" id="errorMsg"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="field">
                    <label class="field-label">E-mail</label>
                    <div class="field-wrap">
                        <i class="fas fa-envelope"></i>
                        <input type="email" class="field-input" id="email" placeholder="seu@email.com" required autocomplete="email">
                    </div>
                </div>
                <div class="field">
                    <label class="field-label">Senha</label>
                    <div class="field-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" class="field-input" id="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>
                <div class="opts">
                    <label><input type="checkbox" style="accent-color:var(--primary)"> Lembrar</label>
                    <a href="#">Esqueceu a senha?</a>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">Entrar</button>
            </form>

            <div class="divider"><span>ou</span></div>

            <div class="demo-card">
                <h4>Contas de demonstração</h4>
                <button class="demo-btn" onclick="loginAs('admin')">
                    <i class="fas fa-shield-alt"></i> Entrar como Administrador
                </button>
                <button class="demo-btn" onclick="loginAs('user')">
                    <i class="fas fa-user"></i> Entrar como Usuário
                </button>
            </div>

            <p class="goto-cadastro">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="../index.html" class="bn-item">
            <i class="fas fa-home"></i>
            Home
        </a>
        <a href="login.html" class="bn-item active">
            <i class="fas fa-sign-in-alt"></i>
            Login
        </a>
        <a href="cadastro.html" class="bn-item">
            <i class="fas fa-user-plus"></i>
            Cadastro
        </a>
    </nav>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/firebase-services.js"></script>
    <script>
        (function() {
            var u = JSON.parse(localStorage.getItem('iaxo_user'));
            if (u && u.role) {
                window.location.href = u.role === 'admin' ? 'admin.html' : 'usuario.html';
            }
        })();

        function showError(msg) {
            var el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function setLoading(loading) {
            var btn = document.getElementById('loginBtn');
            if (loading) {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> Entrando...';
            } else {
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        }

        function loginAs(role) {
            var data = role === 'admin'
                ? { role: 'admin', name: 'Administrador', email: 'admin@iaxo.com', business: 'IAXO Ads', plan: 'premium' }
                : { role: 'user', name: 'Carlos Silva', email: 'carlos@email.com', business: 'Clínica Renova', plan: 'premium' };
            localStorage.setItem('iaxo_user', JSON.stringify(data));
            window.location.href = role === 'admin' ? 'admin.html' : 'usuario.html';
        }

        function handleLogin(e) {
            e.preventDefault();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            if (!email || !password) { showError('Preencha e-mail e senha.'); return; }

            setLoading(true);
            document.getElementById('errorMsg').style.display = 'none';

            auth.signInWithEmailAndPassword(email, password)
                .then(function(cred) {
                    return db.collection('users').doc(cred.user.uid).get().then(function(doc) {
                        var userData = doc.exists ? doc.data() : {};
                        var userObj = {
                            uid: cred.user.uid,
                            name: userData.name || cred.user.displayName || email,
                            email: email,
                            role: userData.role || 'user',
                            business: userData.business || '',
                            niche: userData.niche || '',
                            plan: userData.plan || 'premium'
                        };
                        localStorage.setItem('iaxo_user', JSON.stringify(userObj));
                        window.location.href = userObj.role === 'admin' ? 'admin.html' : 'usuario.html';
                    });
                })
                .catch(function(err) {
                    setLoading(false);
                    if (email === 'admin@iaxo.com' && password === 'admin123') {
                        loginAs('admin');
                    } else if (email === 'carlos@email.com' && password === 'user123') {
                        loginAs('user');
                    } else if (err.code === 'auth/user-not-found') {
                        showError('Conta não encontrada. Crie uma conta ou use as demonstrações.');
                    } else if (err.code === 'auth/wrong-password') {
                        showError('Senha incorreta. Tente novamente.');
                    } else if (err.code === 'auth/too-many-requests') {
                        showError('Muitas tentativas. Aguarde alguns minutos.');
                    } else {
                        showError('Erro ao entrar: ' + err.message);
                    }
                });
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('../sw.js').catch(function(){});
        }
    </script>
</body>
</html>
